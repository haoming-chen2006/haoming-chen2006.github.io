<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skills &amp; slays — workbench</title>
    <style>
      /* A stand-in for the table. Only what an effect actually reads:
         `.fk-room` (the layer's parent and the `--fk-photo-w` holder),
         `.fk-seats` (what a quake shakes), `.fk-ring`, `.fk-photo` (the host),
         and `.fk-table` (where a judgement verdict is drawn). Everything else
         in `room.css` is irrelevant here. */
      html, body { margin: 0; height: 100%; background: #0d120c; color: #e8ddcd;
        font: 12px system-ui, sans-serif; overflow: hidden; }
      .fk-room { --fk-photo-w: 118px; position: absolute; inset: 0 0 108px 0;
        overflow: hidden;
        background:
          radial-gradient(58% 42% at 50% 46%, rgba(216,178,106,0.10) 0%, transparent 70%),
          radial-gradient(120% 96% at 50% 30%, #2b3a2b 0%, #131a14 76%), #131a14; }
      .fk-seats { position: absolute; inset: 0; overflow: hidden; }
      .fk-ring { position: absolute; inset: 0 16px 0 0; }
      .fk-seat-slot { position: absolute; width: var(--fk-photo-w);
        transform: translate(-50%, -50%); }
      .fk-photo { position: relative; width: 100%;
        height: calc(var(--fk-photo-w) * 1.33); border: 1px solid #6c5b41;
        border-radius: 6px; overflow: hidden;
        background: linear-gradient(160deg, #3a3025, #221b13);
        box-shadow: inset 0 0 0 1px rgba(255,226,168,0.10), 0 6px 16px rgba(0,0,0,0.6); }
      .fk-photo b { position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 30px; color: #8b7b60; }
      .fk-photo u { position: absolute; left: 3px; top: 2px; font-size: 10px;
        text-decoration: none; color: #d8b26a; letter-spacing: .08em; }
      .fk-anim-layer { position: absolute; inset: 0; overflow: visible;
        pointer-events: none; z-index: 9; }
      .fk-table { position: absolute; left: 50%; top: 50%; width: 210px; height: 96px;
        transform: translate(-50%, -50%); border: 1px dashed #4b3f2d; border-radius: 6px; }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 108px;
        overflow: auto; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px;
        align-content: flex-start; background: #171310; border-top: 1px solid #4b3f2d; }
      #bar button { font: 11px system-ui, sans-serif; padding: 3px 7px;
        color: #f0e5da; background: #2c241a; border: 1px solid #5d4d36;
        border-radius: 3px; cursor: pointer; }
      #bar button:hover { background: #40331f; }
      #bar button.hot { background: #5a2118; border-color: #a8503c; }
      .grp { align-self: center; padding: 0 6px 0 10px; color: #d8b26a;
        font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <div class="fk-room">
      <div class="fk-seats">
        <div class="fk-ring"><div class="fk-table"></div></div>
      </div>
    </div>
    <div id="bar"></div>
    <script type="module" src="./workbench.ts"></script>
  </body>
</html>
