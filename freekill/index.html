<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="狗卡杀 · 打开链接就能玩的三国杀，无需安装、无需同步扩展包、无需服务器地址。" />
    <title>狗卡杀 Dog Card Kill</title>
    <link rel="preload" href="/freekill/fonts/lxgwwenkai.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The three TTFs in the Qt client are Founder / Stone Co. proprietary faces
         and cannot ship. This is 霞鹜文楷 (LXGW WenKai), OFL 1.1, subset to the
         1,443 Han the standard pack uses. License: /freekill/fonts/*.OFL.txt */
      @font-face {
        font-family: 'FKHan';
        src: url('/freekill/fonts/lxgwwenkai.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      html, body, #root { height: 100%; margin: 0; }
      body { background: #14110f; color: #e8e0d4; }
      /* First paint before React: the splash the loader replaces. */
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
        justify-items: center; font-family: 'FKHan', 'PingFang SC', system-ui, sans-serif;
      }
      #boot h1 { margin: 0; font-size: 46px; letter-spacing: 12px; font-weight: 400; color: #d9c9a3; }
      #boot p { margin: 0; color: #8b8073; font-size: 14px; letter-spacing: 2px; }
    </style>
    <script type="module" crossorigin src="/freekill/assets/index-y9xVZ2xb.js"></script>
    <link rel="stylesheet" crossorigin href="/freekill/assets/index-BExpRdB1.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><h1>狗卡杀</h1><p>正在载入</p></div>
    <script>
      /* The splash paints before any module runs, so it cannot ask the i18n
         layer what language to use. It reads the same two inputs the store
         reads (?lang=, then localStorage 'fk.lang') and swaps the two words it
         owns. Kept deliberately tiny: React replaces this element as soon as it
         mounts, and a returning English player should never see a Chinese
         flash on the way. */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('lang');
          var lang = q || localStorage.getItem('fk.lang');
          if (lang !== 'en_US') return;
          document.documentElement.lang = 'en-US';
          var boot = document.getElementById('boot');
          boot.querySelector('h1').textContent = 'FreeKill';
          boot.querySelector('h1').style.letterSpacing = '2px';
          boot.querySelector('p').textContent = 'Loading';
        } catch (e) { /* private mode, or no storage at all */ }
      })();
    </script>
  </body>
</html>
