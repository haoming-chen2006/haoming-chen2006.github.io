<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kingsroad</title>
  <meta name="description" content="Kingsroad: a first-person 5v5 lane battle in the spirit of Honor of Kings. Pick a hero, push the lanes, break the crystal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/kingsroad/assets/index-BRze_W4V.js"></script>
  <link rel="stylesheet" crossorigin href="/kingsroad/assets/index-Cmmnr2pb.css">
</head>
<body>
  <div id="app">
    <div id="viewport"><canvas id="canvas"></canvas><canvas id="overlay"></canvas><div id="vignette"></div><div id="damageFlash"></div></div>

    <!-- Loading splash -->
    <div id="loading" class="splash">
      <div class="splash-inner">
        <div class="crest"><span class="crest-crown">♛</span></div>
        <h1 class="title small">KINGSROAD</h1>
        <div class="spinner"></div>
        <p class="muted" id="loadingText" data-i18n="loading.forging">Raising the towers…</p>
      </div>
    </div>

    <!-- Main menu -->
    <section id="menu" class="screen">
      <div class="menu-card">
        <div class="title-wrap">
          <div class="title-particles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <h1 class="title">KINGSROAD</h1>
          <div class="title-rule"><span></span><b>♛</b><span></span></div>
          <p class="tagline" data-i18n="menu.tagline">Three lanes. Ten heroes. One crystal. Seen through your own eyes.</p>
        </div>
        <div class="mode-row">
          <div class="seg" id="modeSeg">
            <button data-mode="5v5" class="active">5v5</button>
            <button data-mode="3v3">3v3</button>
            <button data-mode="1v1">1v1</button>
          </div>
          <div class="seg" id="difficultySeg">
            <button data-diff="easy" data-i18n="diff.easy">Easy</button>
            <button data-diff="normal" class="active" data-i18n="diff.normal">Normal</button>
            <button data-diff="hard" data-i18n="diff.hard">Hard</button>
          </div>
        </div>
        <p class="muted small" id="modeDesc"></p>
        <div class="menu-buttons">
          <button id="btnPlay" class="btn primary big"><span class="btn-icon">⚔</span><span data-i18n="menu.play">Play</span></button>
          <button id="btnOnline" class="btn big online"><span class="btn-icon">⚑</span><span data-i18n="menu.online">Online Lobby</span><span class="btn-sub" data-i18n="menu.onlineSub">friends and bots, up to 5v5</span></button>
          <div class="menu-row">
            <button id="btnHeroes" class="btn"><span class="btn-icon">♜</span><span data-i18n="menu.heroes">Heroes</span></button>
            <button id="btnHelp" class="btn"><span class="btn-icon">?</span><span data-i18n="menu.howToPlay">How to Play</span></button>
            <button id="btnSettings" class="btn"><span class="btn-icon">⚙</span><span data-i18n="menu.settings">Settings</span></button>
          </div>
        </div>
        <div class="menu-footer">
          <span class="record" id="record"></span>
          <div class="menu-controls">
            <button id="btnSound" class="btn small icon" title="Sound">🔊</button>
            <button id="btnMusic" class="btn small icon" title="Music">♪</button>
            <button id="btnQuality" class="btn small icon" title="Quality">✦</button>
            <button id="btnLang" class="btn small icon lang" title="Language">中</button>
            <button id="btnFullscreen" class="btn small icon" title="Fullscreen">⛶</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Hero select -->
    <section id="select" class="screen hidden">
      <div class="select-layout">
        <div class="select-top">
          <h2 class="heading" data-i18n="select.title">Choose your hero</h2>
          <div class="select-mode" id="selectMode"></div>
        </div>
        <div class="select-body">
          <div class="select-left"><div class="hero-grid" id="heroGrid"></div><div class="spell-row"><span class="spell-label" data-i18n="select.spell">召唤师技能</span><div id="spellRow"></div></div></div>
          <div class="hero-detail" id="heroDetail"></div>
        </div>
        <div class="select-foot">
          <button id="btnSelectBack" class="btn ghost" data-i18n="common.back">Back</button>
          <div class="teams-preview" id="teamsPreview"></div>
          <button id="btnStart" class="btn primary big"><span class="btn-icon">⚔</span><span data-i18n="select.start">To Battle</span></button>
        </div>
      </div>
    </section>

    <!-- Heroes codex -->
    <section id="codex" class="screen hidden">
      <div class="select-layout">
        <div class="select-top"><h2 class="heading" data-i18n="codex.title">Heroes</h2></div>
        <div class="select-body">
          <div class="hero-grid" id="codexGrid"></div>
          <div class="hero-detail" id="codexDetail"></div>
        </div>
        <div class="select-foot"><button id="btnCodexBack" class="btn ghost" data-i18n="common.back">Back</button></div>
      </div>
    </section>

    <!-- Help -->
    <section id="help" class="screen hidden">
      <div class="help-card">
        <h2 class="heading" data-i18n="help.title">How to play</h2>
        <div class="help-cols" id="helpBody"></div>
        <button id="btnHelpBack" class="btn primary" data-i18n="common.back">Back</button>
      </div>
    </section>

    <!-- Online lobby (filled by src/ui/online.ts) -->
    <section id="online" class="screen hidden"><div class="online-card" id="onlineCard"></div></section>

    <!-- Game -->
    <section id="game" class="screen hidden">
      <div id="stage">
        <div id="topbar">
          <div class="tb-side"><span class="tb-badge you">◆</span><span class="tb-kills you" id="k0">0</span><span class="tb-towers you" id="t0"></span></div>
          <div class="tb-center"><div id="timer">0:00</div><div id="phase"></div><div id="netPill" class="net-pill hidden"></div></div>
          <div class="tb-side right"><span class="tb-towers enemy" id="t1"></span><span class="tb-kills enemy" id="k1">0</span><span class="tb-badge enemy">◆</span></div>
        </div>
        <div id="countdown" class="hidden"></div>
        <div id="banner" class="hidden"><div id="bannerText"></div><div id="bannerSub"></div></div>
        <div id="streak" class="hidden"></div>
        <div id="feed"></div>
        <div id="hint"></div>
        <div id="toast" class="toast-stack"></div>
        <div id="respawn" class="hidden"><div class="respawn-title" data-i18n="hud.slain">You were slain</div><div class="respawn-timer" id="respawnTimer">5</div><div class="muted" data-i18n="hud.respawnHint">Watching your team…</div></div>
        <div id="teamBars"><div class="teambar" id="teamMine"></div><div class="teambar enemy" id="teamFoe"></div></div>
        <div id="hudBottom">
          <div id="heroCard">
            <div class="hc-portrait" id="hcPortrait"></div>
            <div class="hc-body">
              <div class="hc-top"><span class="hc-name" id="hcName"></span><span class="hc-level" id="hcLevel">1</span></div>
              <div class="bar hp"><div class="fill" id="hpFill"></div><span id="hpText"></span></div>
              <div class="bar mana"><div class="fill" id="manaFill"></div><span id="manaText"></span></div>
              <div class="bar xp"><div class="fill" id="xpFill"></div></div>
              <div class="bar crown" id="crownBar" title="Resonance: land skills on enemy heroes to crown your next skill"><div class="fill" id="crownFill"></div><span>♛</span></div>
            </div>
          </div>
          <div id="skills"></div>
          <div id="itemsWrap"><div id="goldRow"><span class="gold-coin">●</span><span id="gold">500</span><button id="btnShop" class="btn small" data-i18n="hud.shop">Shop (I)</button><label class="auto"><input type="checkbox" id="autoBuy" checked /><span data-i18n="hud.autoBuy">Auto buy</span></label></div><div id="items"></div></div>
        </div>
        <div id="buffs"></div>
        <div id="scoreboard" class="hidden"></div>
        <div id="shop" class="hidden"><div class="shop-head"><h3 class="heading" data-i18n="hud.shopTitle">Shop</h3><span class="muted" id="shopGold"></span><button id="btnShopClose" class="btn small ghost">✕</button></div><div class="shop-grid" id="shopGrid"></div><div class="shop-build" id="shopBuild"></div></div>
      </div>
      <div id="pauseOverlay" class="overlay hidden">
        <div class="dialog">
          <h2 class="heading" id="pauseTitle" data-i18n="pause.paused">Paused</h2>
          <p class="muted" id="pauseSub" data-i18n="pause.sub">The match is paused. Take a breath.</p>
          <button id="btnResume" class="btn primary" data-i18n="pause.resume">Resume</button>
          <button id="btnPauseSettings" class="btn" data-i18n="pause.settings">Settings</button>
          <button id="btnQuit" class="btn ghost" data-i18n="pause.quit">Surrender &amp; Quit</button>
        </div>
      </div>
      <div id="results" class="overlay hidden results-overlay">
        <div class="dialog results">
          <div class="result-crest"><span>♛</span></div>
          <h2 id="resultTitle">Victory</h2>
          <div id="resultScore"></div>
          <p id="resultReason" class="muted"></p>
          <div id="resultAwards" class="awards"></div>
          <table id="resultStats"></table>
          <div class="row">
            <button id="btnAgain" class="btn primary" data-i18n="results.again">Play Again</button>
            <button id="btnMenu" class="btn" data-i18n="results.menu">Main Menu</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <div id="settingsModal" class="overlay hidden">
      <div class="dialog settings">
        <h2 class="heading" data-i18n="settings.title">Settings</h2>
        <div class="settings-grid">
          <label><span data-i18n="settings.sfx">Sound volume</span><input type="range" id="setSfx" min="0" max="100" step="5" /><output id="setSfxOut">55%</output></label>
          <label><span data-i18n="settings.music">Music volume</span><input type="range" id="setMusic" min="0" max="100" step="5" /><output id="setMusicOut">55%</output></label>
          <label><span data-i18n="settings.sensitivity">Mouse sensitivity</span><input type="range" id="setSens" min="0.3" max="2.5" step="0.1" /><output id="setSensOut">1.0×</output></label>
          <label><span data-i18n="settings.fov">Field of view</span><input type="range" id="setFov" min="60" max="100" step="2" /><output id="setFovOut">78°</output></label>
          <label class="toggle"><span data-i18n="settings.invert">Invert mouse Y</span><input type="checkbox" id="setInvert" /><i></i></label>
          <label class="toggle"><span data-i18n="settings.announcer">Announcer voice</span><input type="checkbox" id="setAnnouncer" /><i></i></label>
          <label class="toggle"><span data-i18n="settings.firstPerson">Start in first person</span><input type="checkbox" id="setFirst" /><i></i></label>
          <label><span data-i18n="settings.quality">Graphics</span><div class="seg small" id="setQuality"><button data-q="high" data-i18n="settings.high">High</button><button data-q="low" data-i18n="settings.low">Low</button></div></label>
          <label><span data-i18n="settings.language">Language</span><div class="seg small" id="setLangSeg"><button data-lang="en">English</button><button data-lang="zh">中文</button></div></label>
        </div>
        <div class="row"><button id="btnResetProgress" class="btn small ghost" data-i18n="settings.reset">Reset record</button><button id="btnSettingsClose" class="btn primary" data-i18n="common.done">Done</button></div>
      </div>
    </div>
  </div>
</body>
</html>
