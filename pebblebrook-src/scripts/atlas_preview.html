<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>atlas preview</title>
<style>
  body { margin: 0; background: #223; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ?sheet=rpg&x0=0&y0=0&cols=20&rows=16&zoom=4&tile=16&margin=1
  const q = new URLSearchParams(location.search);
  const sheet = q.get('sheet') || 'rpg';
  const x0 = +(q.get('x0') || 0), y0 = +(q.get('y0') || 0);
  const cols = +(q.get('cols') || 20), rows = +(q.get('rows') || 16);
  const zoom = +(q.get('zoom') || 4);
  const T = +(q.get('tile') || 16), M = +(q.get('margin') || 1);
  const cell = T * zoom + 26;
  const c = document.getElementById('c');
  c.width = cols * cell; c.height = rows * cell;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const img = new Image();
  img.src = '/pebblebrook/assets/kenney/' + sheet + '.png';
  img.onload = () => {
    g.fillStyle = '#334'; g.fillRect(0, 0, c.width, c.height);
    for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) {
      const col = x0 + cc, row = y0 + r;
      const px = cc * cell + 4, py = r * cell + 4;
      g.fillStyle = '#d8b0e0'; g.fillRect(px, py, T * zoom, T * zoom);
      g.drawImage(img, col * (T + M), row * (T + M), T, T, px, py, T * zoom, T * zoom);
      g.fillStyle = '#fff'; g.font = '11px monospace';
      g.fillText(col + ',' + row, px, py + T * zoom + 12);
    }
    document.title = 'ready';
  };
</script>
</body>
</html>
